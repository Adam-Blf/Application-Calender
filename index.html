<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Calendrier PWA : enregistrez vos dates, découvrez des activités dans la grande ville la plus proche et consultez la météo." />
  <title>Mon Calendrier</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>📅 Mon Calendrier</h1>
    <div class="location-pill" id="locationPill" title="Localisation actuelle">
      <span id="locationLabel">Localisation…</span>
      <button id="refreshLocationBtn" class="icon-btn" aria-label="Actualiser la localisation">↻</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="calendar" role="tab">Calendrier</button>
    <button class="tab" data-tab="weather" role="tab">Météo</button>
    <button class="tab" data-tab="activities" role="tab">Activités</button>
  </nav>

  <main>
    <!-- Onglet Calendrier -->
    <section class="panel active" id="tab-calendar">
      <div class="calendar-toolbar">
        <button class="nav-btn" id="prevMonth" aria-label="Mois précédent">‹</button>
        <h2 id="monthTitle">—</h2>
        <button class="nav-btn" id="nextMonth" aria-label="Mois suivant">›</button>
        <button class="today-btn" id="todayBtn">Aujourd'hui</button>
      </div>
      <div class="weekdays" id="weekdays"></div>
      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="calendar-actions">
        <button class="primary-btn" id="addEventBtn">+ Nouvel événement</button>
        <button class="ghost-btn" id="exportIcsBtn">⬇ Exporter (.ics)</button>
      </div>

      <div class="day-events" id="dayEvents">
        <h3 id="dayEventsTitle">Sélectionnez un jour</h3>
        <ul id="dayEventsList"></ul>
      </div>
    </section>

    <!-- Onglet Météo -->
    <section class="panel" id="tab-weather">
      <h2>Météo</h2>
      <div id="weatherContent" class="weather-content">
        <p class="muted">Chargement de la météo…</p>
      </div>
    </section>

    <!-- Onglet Activités -->
    <section class="panel" id="tab-activities">
      <!-- Mes idées d'activités personnelles -->
      <section class="my-ideas">
        <h2>💡 Mes idées d'activités</h2>
        <form id="ideaForm" class="idea-form">
          <input type="text" id="ideaInput" placeholder="Ex : Pique-nique au parc" required />
          <select id="ideaCategory" aria-label="Catégorie de l'idée">
            <option value="">Catégorie…</option>
            <option value="🏛️ Culture">Culture</option>
            <option value="🌳 Plein air">Plein air</option>
            <option value="🍽️ Gastronomie">Gastronomie</option>
            <option value="🎭 Sortie">Sortie</option>
            <option value="🏃 Sport">Sport</option>
            <option value="✈️ Voyage">Voyage</option>
          </select>
          <button type="submit" class="primary-btn">Ajouter</button>
        </form>
        <ul id="ideasList" class="ideas-list"></ul>
      </section>

      <hr class="divider" />

      <div class="activities-head">
        <h2>Suggestions à proximité</h2>
        <select id="activityCategory" aria-label="Catégorie d'activité">
          <option value="tourism">Tourisme &amp; culture</option>
          <option value="leisure">Loisirs &amp; parcs</option>
          <option value="food">Restaurants &amp; cafés</option>
          <option value="entertainment">Divertissement</option>
        </select>
      </div>
      <p class="muted" id="activitiesCity">Recherche de la grande ville la plus proche…</p>
      <div id="activitiesContent" class="activities-content"></div>
    </section>
  </main>

  <!-- Modale d'événement -->
  <div class="modal-overlay" id="eventModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Nouvel événement</h3>
      <form id="eventForm">
        <input type="hidden" id="eventId" />
        <label>Titre
          <input type="text" id="eventTitle" required placeholder="Ex : Visite du musée" />
        </label>
        <div class="form-row">
          <label>Date
            <input type="date" id="eventDate" required />
          </label>
          <label>Heure
            <input type="time" id="eventTime" />
          </label>
        </div>
        <label>Lieu
          <input type="text" id="eventLocation" placeholder="Ex : Centre-ville" />
        </label>
        <label>Notes
          <textarea id="eventNotes" rows="3" placeholder="Détails…"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="ghost-btn" id="deleteEventBtn" hidden>Supprimer</button>
          <span class="spacer"></span>
          <button type="button" class="ghost-btn" id="cancelEventBtn">Annuler</button>
          <button type="submit" class="primary-btn">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/storage.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/location.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/activities.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
